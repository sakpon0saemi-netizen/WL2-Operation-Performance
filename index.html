<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WL2 Monitoring System</title>

<!-- ซูมได้ (ไม่ใส่ user-scalable=no) / viewport-fit=cover ให้ใช้พื้นที่เต็มจอบน iPhone ที่มีติ่งหน้าจอ -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- iOS -->
<link rel="apple-touch-icon" href="wl2-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="wl2-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="wl2-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="wl2-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- default = เนื้อหาเริ่มใต้แถบสถานะ ไม่มุดใต้นาฬิกา -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WL2">
<meta name="description" content="WL2-Operation-Performance" — production, reliability, loss &amp; gained and CM follow-up">

<!-- Android / Chrome -->
<link rel="icon" type="image/png" href="wl2-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#312e81">
<meta name="color-scheme" content="light">

<style>
  :root{--a:#4338ca;--b:#6d28d9;--c:#0284c7;--t:#a5f3fc}
  html,body{margin:0;padding:0;height:100%;background:#312e81;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  #frame{position:fixed;top:0;left:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:#f4f7fb}

  /* ---------- หน้าโหลด ---------- */
  #splash{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;color:#fff;overflow:hidden;
    background:linear-gradient(135deg,#1e1b4b 0%,var(--a) 38%,var(--b) 66%,var(--c) 100%);
    transition:opacity .55s ease,visibility .55s}
  #splash.gone{opacity:0;visibility:hidden;pointer-events:none}
  #splash::before,#splash::after{content:"";position:absolute;border-radius:50%;pointer-events:none;
    filter:blur(2px);animation:drift 14s ease-in-out infinite alternate}
  #splash::before{width:520px;height:520px;right:-160px;top:-200px;
    background:radial-gradient(closest-side,rgba(34,211,238,.5),transparent 70%)}
  #splash::after{width:460px;height:460px;left:-140px;bottom:-220px;animation-duration:19s;animation-direction:alternate-reverse;
    background:radial-gradient(closest-side,rgba(236,72,153,.38),transparent 70%)}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-40px,34px,0) scale(1.15)}}
  .badge{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .mark{font-size:60px;font-weight:800;letter-spacing:-.05em;line-height:1;
    background:linear-gradient(92deg,#fff,var(--t));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{font-size:13px;font-weight:600;letter-spacing:.02em;opacity:.82}
  .pills{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 24px}
  .pills span{font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:99px;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
    opacity:0;transform:translateY(8px);animation:pop .6s ease forwards}
  .pills span:nth-child(2){animation-delay:.12s}.pills span:nth-child(3){animation-delay:.24s}
  .pills span:nth-child(4){animation-delay:.36s}
  @keyframes pop{to{opacity:1;transform:none}}
  .loadbar{position:relative;z-index:1;width:168px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
  .loadbar i{position:absolute;inset:0 auto 0 0;width:40%;border-radius:4px;
    background:linear-gradient(90deg,transparent,var(--t),transparent);animation:slide 1.3s ease-in-out infinite}
  @keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(300%)}}
  .sub{position:relative;z-index:1;font-size:12.5px;opacity:.78;font-weight:500;min-height:18px;text-align:center;padding:0 24px}

  /* ---------- โหลดช้า / ผิดพลาด ---------- */
  #fallback{position:fixed;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:10;
    display:none;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 16px}
  #fallback a,#fallback button{font:inherit;font-size:13px;font-weight:700;padding:11px 20px;border-radius:999px;
    text-decoration:none;cursor:pointer;border:0;box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}
  #fallback a{background:#fff;color:#1e1b4b}
  #fallback button{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(6px)}
  #fallback.on{display:flex}
  noscript{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:#312e81;color:#fff;font-size:15px;font-weight:600;padding:24px;text-align:center}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<div id="splash" role="status" aria-live="polite">
  <div class="badge">
    <div class="mark">WL2</div>
    <div class="tag">Overburden Monitoring System</div>
  </div>
  <div class="pills"><span>Production</span><span>Reliability</span><span>Loss &amp; Gained</span><span>CM Follow-up</span></div>
  <div class="loadbar"><i></i></div>
  <div class="sub" id="splashMsg">Loading monitoring system…</div>
</div>

<iframe id="frame" title="WL2 Overburden Monitoring System"
        allow="clipboard-write; fullscreen"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<div id="fallback">
  <button id="retry" type="button">Retry</button>
  <a id="openTab" href="#" target="_blank" rel="noopener">Open in browser instead</a>
</div>

<noscript>JavaScript must be enabled to use the WL2 system</noscript>

<script>
  /* ====== วางลิงก์ /exec ของคุณตรงนี้ ====== */
  var APP_URL = "https://script.google.com/macros/s/AKfycbzaBPwLwC2rrJ4Jeey7S-3RnZnCQFIA2IsahCk3cIpJjgb0xEk4fXmpJZWS1Dqzq4CB3Q/exec";
  /* ======================================== */

  var frame    = document.getElementById('frame'),
      splash   = document.getElementById('splash'),
      msg      = document.getElementById('splashMsg'),
      fallback = document.getElementById('fallback'),
      openTab  = document.getElementById('openTab'),
      loaded   = false, timers = [];

  openTab.href = APP_URL;

  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  function start(){
    clearTimers(); loaded = false;
    fallback.classList.remove('on');
    splash.classList.remove('gone');
    msg.textContent = 'Loading monitoring system…';
    /* ใส่ตัวกันแคช เฉพาะตอนกด "ลองใหม่" เพื่อให้ได้หน้าล่าสุดหลัง Deploy */
    frame.src = start.n ? APP_URL + (APP_URL.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now() : APP_URL;
    start.n = (start.n || 0) + 1;
    timers.push(setTimeout(function(){ if(!loaded) msg.textContent = 'Taking longer than usual — Apps Script is starting up…'; }, 6000));
    timers.push(setTimeout(function(){
      if(loaded) return;
      splash.classList.add('gone');          /* ให้เห็นหน้าที่โหลดค้างอยู่ ดีกว่าหน้าม่วงตลอด */
      fallback.classList.add('on');
    }, 14000));
  }

  frame.addEventListener('load', function(){
    /* ครั้งแรกที่ iframe ว่าง (about:blank) จะยิง load ด้วย ข้ามไป */
    if(!frame.getAttribute('src')) return;
    loaded = true; clearTimers();
    fallback.classList.remove('on');
    setTimeout(function(){ splash.classList.add('gone'); }, 350);
  });
  document.getElementById('retry').addEventListener('click', start);
  window.addEventListener('offline', function(){ msg.textContent = 'No internet connection'; });
  window.addEventListener('online',  function(){ if(!loaded) start(); });
  start();

  /* ==================================================================
     สะพานเก็บ token
     Safari ไม่ยอมให้หน้าที่อยู่ใน iframe เก็บข้อมูลลงเครื่อง
     หน้านี้เป็นหน้านอกสุดจึงเก็บแทนให้ แล้วส่งกลับเข้าไปเมื่อถูกขอ
     (โปรโตคอลเดียวกับ Index.html — op: get / set / clear / reload)
     ================================================================== */
  var KEY = 'wl2_token';
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.__wl2 !== 1 || !d.op) return;
    var src = e.source;
    function reply(payload) {
      payload.__wl2 = 1; payload.id = d.id;
      try { src.postMessage(payload, '*'); } catch (err) {}
    }
    try {
      if (d.op === 'get')         reply({ value: localStorage.getItem(KEY) || '' });
      else if (d.op === 'set')    { localStorage.setItem(KEY, d.value || ''); reply({ ok:true }); }
      else if (d.op === 'clear')  { localStorage.removeItem(KEY); reply({ ok:true }); }
      else if (d.op === 'reload') { reply({ ok:true }); location.reload(); }
      else reply({ ok:false });
    } catch (err) { reply({ error:String(err) }); }
  }, false);
</script>
</body>
</html>

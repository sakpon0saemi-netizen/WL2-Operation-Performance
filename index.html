
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>WL2 Operation Performance</title>
  <meta name="description"
        content="WL2 Operation Performance - Production, Reliability, Loss and Gained, and CM Follow-up">
  <meta name="theme-color" content="#312e81">
  <meta name="color-scheme" content="light">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./wl2-icon.png">
  <link rel="apple-touch-icon" href="./wl2-icon.png">
  <link rel="apple-touch-icon" sizes="180x180"
        href="./wl2-icon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WL2">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="default">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    :root {
      color-scheme: light;
      --bg: #312e81;
      --primary: #4338ca;
      --cyan: #a5f3fc;
      --text: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
      background: var(--bg);
    }

    #frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: #f4f7fb;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 24px;
      color: var(--text);
      background: linear-gradient(
        135deg, #1e1b4b 0%, #4338ca 40%,
        #6d28d9 68%, #0284c7 100%
      );
      transition: opacity .35s ease, visibility .35s ease;
    }

    #splash.gone {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .brand {
      text-align: center;
    }

    .logo {
      font-size: 64px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: -.06em;
      background: linear-gradient(90deg, #fff, var(--cyan));
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      opacity: .85;
    }

    .pills {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 340px;
    }

    .pills span {
      font-size: 11px;
      font-weight: 650;
      padding: 7px 11px;
      border: 1px solid #ffffff35;
      border-radius: 30px;
      background: #ffffff18;
    }

    .loader {
      width: 170px;
      height: 4px;
      overflow: hidden;
      border-radius: 8px;
      background: #ffffff30;
    }

    .loader i {
      display: block;
      width: 40%;
      height: 100%;
      background: var(--cyan);
      animation: slide 1.3s ease-in-out infinite;
    }

    @keyframes slide {
      from { transform: translateX(-110%); }
      to   { transform: translateX(350%); }
    }

    #message {
      min-height: 20px;
      font-size: 12px;
      text-align: center;
      opacity: .85;
    }

    #fallback {
      display: none;
      position: fixed;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
    }

    #fallback.on { display: flex; }

    #fallback button,
    #fallback a {
      padding: 12px 18px;
      border-radius: 30px;
      border: 1px solid #ffffff50;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    #retry {
      color: #1e1b4b;
      background: white;
    }

    #openTab {
      color: white;
      background: #ffffff20;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="brand">
      <div class="logo">WL2</div>
      <div class="subtitle">WL2 Operation Performance</div>
    </div>

    <div class="pills">
      <span>Production</span>
      <span>Reliability</span>
      <span>Loss &amp; Gained</span>
      <span>CM Follow-up</span>
    </div>

    <div class="loader"><i></i></div>
    <div id="message">Loading monitoring system...</div>
  </div>

  <iframe
    id="frame"
    title="WL2 Operation Performance"
    allow="clipboard-write; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <div id="fallback">
    <button id="retry" type="button">Retry</button>
    <a id="openTab" target="_blank"
       rel="noopener noreferrer" href="#">
      Open WL2 directly
    </a>
  </div>

  <noscript>
    JavaScript must be enabled to use WL2.
  </noscript>

  <script>
    "use strict";

    // ==========================================
    // WL2 GOOGLE APPS SCRIPT WEB APP
    // Keep the deployed /exec URL here.
    // ==========================================
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbzaBPwLwC2rrJ4Jeey7S-3RnZnCQFIA2IsahCk3cIpJjgb0xEk4fXmpJZWS1Dqzq4CB3Q/exec";

    const TOKEN_KEY = "wl2_token";
    const frame = document.getElementById("frame");
    const splash = document.getElementById("splash");
    const message = document.getElementById("message");
    const fallback = document.getElementById("fallback");
    const openTab = document.getElementById("openTab");

    let timers = [];
    let attempt = 0;
    let loaded = false;

    openTab.href = APP_URL;

    function clearTimers() {
      timers.forEach(id => clearTimeout(id));
      timers = [];
    }

    function hideSplash() {
      splash.classList.add("gone");
    }

    function start() {
      clearTimers();
      loaded = false;

      fallback.classList.remove("on");
      splash.classList.remove("gone");
      message.textContent = "Loading monitoring system...";

      // Add a cache-busting parameter only on retries.
      const separator = APP_URL.includes("?") ? "&" : "?";
      frame.src = attempt === 0
        ? APP_URL
        : APP_URL + separator + "r=" + Date.now();

      attempt++;

      timers.push(setTimeout(() => {
        if (!loaded) {
          message.textContent =
            "The system is taking longer than usual...";
        }
      }, 6000));

      timers.push(setTimeout(() => {
        if (!loaded) {
          hideSplash();
          fallback.classList.add("on");
        }
      }, 18000));
    }

    frame.addEventListener("load", () => {
      // An iframe load event does not prove the app
      // rendered successfully. It may also load an error page.
      loaded = true;
      clearTimers();
      fallback.classList.remove("on");
      setTimeout(hideSplash, 350);
    });

    document.getElementById("retry")
      .addEventListener("click", start);

    window.addEventListener("offline", () => {
      message.textContent = "No internet connection.";
    });

    window.addEventListener("online", () => {
      if (!loaded) start();
    });

    // ==========================================
    // WL2 TOKEN BRIDGE
    // Keep compatible with the existing Index.html.
    // ==========================================
    window.addEventListener("message", event => {
      // Accept messages only from our own iframe.
      if (event.source !== frame.contentWindow) return;

      const data = event.data;

      if (!data || data.__wl2 !== 1 || !data.op) return;

      function reply(payload) {
        payload.__wl2 = 1;
        payload.id = data.id;

        try {
          event.source.postMessage(payload, "*");
        } catch (error) {
          // Ignore a reply failure; the caller may time out.
        }
      }

      try {
        switch (data.op) {
          case "get":
            reply({
              value: localStorage.getItem(TOKEN_KEY) || ""
            });
            break;

          case "set":
            localStorage.setItem(
              TOKEN_KEY, data.value || ""
            );
            reply({ ok: true });
            break;

          case "clear":
            localStorage.removeItem(TOKEN_KEY);
            reply({ ok: true });
            break;

          case "reload":
            reply({ ok: true });
            // Reload the outer Wrapper, not the iframe alone.
            setTimeout(() => location.reload(), 50);
            break;

          default:
            reply({ ok: false, error: "Unknown operation" });
        }
      } catch (error) {
        reply({ ok: false, error: String(error) });
      }
    });

    start();
  </script>
</body>
</html>
